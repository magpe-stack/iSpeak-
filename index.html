
<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07152f">
  <meta name="description" content="Aprenda inglês uma palavra por vez com o iSpeak!!!">

  <!-- PWA: manifesto e ícones na raiz do repositório -->
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon-192.png">

  <!-- Estilos -->
  <link rel="stylesheet" href="./styles.css">

  <title>iSpeak!!! — Uma palavra por vez</title>
</head>

<body>
  <header class="topbar">
    <a class="brand" href="./" aria-label="iSpeak!!! início">
      <img src="./logo.svg" alt="Logo iSpeak!!!">
      <span>iSpeak<span class="bang">!!!</span></span>
    </a>

    <button
      id="themeBtn"
      class="icon-btn theme-btn"
      type="button"
      aria-label="Alternar modo claro e escuro"
      title="Alternar modo claro/escuro"
    >
      <svg class="sun" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/>
      </svg>
      <svg class="moon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M20.9 13A8.5 8.5 0 0 1 11 3.1 8.5 8.5 0 1 0 20.9 13Z"/>
      </svg>
    </button>
  </header>

  <main class="app-main">
    <div class="deck-meta">
      <span class="live-dot"></span>
      <span>VOCABULÁRIO EM INGLÊS</span>

      <button
        id="markKnownTop"
        class="known-top icon-btn"
        type="button"
        aria-label="Marcar como aprendida"
        title="Marcar como aprendida"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="m5 12 4 4L19 6"/>
        </svg>
      </button>
    </div>

    <section
      class="word-card"
      aria-live="polite"
      aria-atomic="true"
    >
      <button
        id="favoriteTop"
        class="favorite-top icon-btn"
        type="button"
        aria-label="Adicionar aos favoritos"
        title="Adicionar aos favoritos"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-3-5.6 3 1.1-6.2L3 9.6l6.2-.9L12 3Z"/>
        </svg>
      </button>

      <div class="word-content">
        <div id="wordNumber" class="word-number">
          PALAVRA 1 DE 5.000
        </div>

        <h1 id="wordEnglish">Welcome</h1>

        <div id="wordIpa" class="ipa">/ˈwel.kəm/</div>

        <button
          id="speakMain"
          class="sound-main icon-btn"
          type="button"
          aria-label="Ouvir pronúncia em inglês"
          title="Ouvir pronúncia"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M11 5 6 9H3v6h3l5 4V5Z"/>
            <path d="M15.5 8.5a5 5 0 0 1 0 7m3-10a9 9 0 0 1 0 13"/>
          </svg>
        </button>

        <div class="card-divider"></div>

        <div class="translation-label">
          TRADUÇÃO EM PORTUGUÊS
        </div>

        <p id="wordPortuguese" class="translation">
          Bem-vindo
        </p>

        <span id="wordType" class="word-type"></span>
      </div>

      <div class="card-bottom">
        <span>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 3 3 7.5 12 12l9-4.5L12 3Z"/>
            <path d="m3 12 9 4.5 9-4.5M3 16.5 12 21l9-4.5"/>
          </svg>
          <span id="remainingLabel">5.000 palavras</span>
        </span>

        <span id="knownStatus">Continue praticando!</span>
      </div>
    </section>

    <nav class="controls" aria-label="Controles de estudo">
      <button
        id="favoriteBtn"
        class="control-btn"
        type="button"
        aria-label="Adicionar aos favoritos"
        title="Favoritar"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-3-5.6 3 1.1-6.2L3 9.6l6.2-.9L12 3Z"/>
        </svg>
      </button>

      <button
        id="speakBtn"
        class="control-btn"
        type="button"
        aria-label="Ouvir pronúncia"
        title="Ouvir"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M11 5 6 9H3v6h3l5 4V5Z"/>
          <path d="M15.5 8.5a5 5 0 0 1 0 7m3-10a9 9 0 0 1 0 13"/>
        </svg>
      </button>

      <button
        id="nextBtn"
        class="control-btn next-btn"
        type="button"
        aria-label="Próxima palavra aleatória"
        title="Próxima palavra"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="m5 5 7 7-7 7m7-14 7 7-7 7"/>
        </svg>
      </button>

      <button
        id="knownBtn"
        class="control-btn"
        type="button"
        aria-label="Marcar como aprendida"
        title="Aprendida"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="m5 12 4 4L19 6"/>
        </svg>
      </button>

      <button
        id="shuffleBtn"
        class="control-btn"
        type="button"
        aria-label="Sortear outra palavra"
        title="Sortear"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="m16 3 4 4-4 4M4 7h3c5 0 5 10 10 10h3m-4 4 4-4-4-4M4 17h3c1.5 0 2.5-1 3.4-2.5M13 9.5C14 8 15 7 17 7h3"/>
        </svg>
      </button>
    </nav>

    <div class="progress-area">
      <span id="progressText">0 palavras aprendidas</span>

      <div class="progress-track">
        <div id="progressFill" class="progress-fill"></div>
      </div>

      <button
        id="resetBtn"
        class="reset-btn icon-btn"
        type="button"
        aria-label="Reiniciar sequência"
        title="Reiniciar sequência"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3 12a9 9 0 0 1 15.4-6.4L21 8M21 3v5h-5M21 12a9 9 0 0 1-15.4 6.4L3 16m0 5v-5h5"/>
        </svg>
      </button>
    </div>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- JavaScript -->
  <script src="./app.js" defer></script>
</body>
</html>
